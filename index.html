<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maes — Biographie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR injectée -->
    <header class="navbar">
        <div class="navbar__container" id="navbar-container"></div>
    </header>

    <main class="page-wrapper">

        <!-- HERO injecté -->
        <section class="hero" id="hero-section"></section>

        <!-- STATS injectées -->
        <div class="stats" id="stats-container" role="list"></div>

        <!-- ORIGINES -->
        <section class="section-block section-block--origins">
            <div class="section-block__header">
                <span class="section-block__icon">📍</span>
                <span class="section-block__title">Origines</span>
            </div>
            <div class="section-block__body">
                <p id="origines-texte"></p>
                <!-- MAP injectée -->
                <div class="map-card" id="map-card"></div>
            </div>
        </section>

        <!-- CARRIÈRE -->
        <section class="section-block section-block--career">
            <div class="section-block__header">
                <span class="section-block__icon">🎤</span>
                <span class="section-block__title">Carrière musicale</span>
            </div>
            <div class="section-block__body" id="carriere-body"></div>
        </section>

        <!-- DISCOGRAPHIE -->
        <section class="section-block section-block--disco">
            <div class="section-block__header">
                <span class="section-block__icon">💿</span>
                <span class="section-block__title">Discographie</span>
            </div>
            <div class="section-block__body">
                <ul class="timeline__list" id="timeline-list"></ul>
            </div>
        </section>

        <!-- AFFAIRES JUDICIAIRES -->
        <section class="section-block section-block--legal">
            <div class="section-block__header">
                <span class="section-block__icon">⚖️</span>
                <span class="section-block__title">Affaires judiciaires</span>
            </div>
            <div class="section-block__body" id="legal-body"></div>
        </section>

    </main>

    <footer class="footer">
        <p>© 2025 Maes Fan Page — Projet éducatif</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
